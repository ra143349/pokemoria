<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memoria</title>
    <link rel="stylesheet" href="style.css">
   
</head>
<body>
    <img src="titulo.png" alt="Imagem do Jogo da Memória" id="imagem-jogo">

    <p id="selecao">Escolha a dificuldade</p>

    <div class="jogadas" hidden>Jogadas: <span id="jogadas">0</span></div>

<div class="dificuldade">

    <button class="botao" id="facil">Fácil</button>
    
    <button class="botao" id="medio">Médio</button>

    <button class="botao" id="dificil">Difícil</button>

</div> 
    

    <div class="tabuleiro" id="tabuleiro"></div>

    <button id="reiniciar" hidden>Reiniciar</button>
    
    <script src="script.js"></script>
</body>
</html>
